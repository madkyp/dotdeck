name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-markdown pipx
          pipx install ruff
      - name: Lint
        run: ruff check dotdeck tests
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -t . -v
